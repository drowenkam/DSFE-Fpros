function refreshBookmarks(){const n=$('notebook-bookmarks');if(!n)return;n.innerHTML='';const mark=$('note-bookmark');mark.textContent=noteBookmarks.includes(notePage)?'★ Bookmarked':'☆ Bookmark';if(!noteBookmarks.length){n.innerHTML='<p class="muted small">No bookmarks yet</p>';return}for(const i of [...noteBookmarks].sort((a,b)=>a-b)){const b=document.createElement('button');b.className='btn';b.style.margin='4px';b.textContent='Page '+i;b.onclick=()=>setNotePage(i);n.appendChild(b)}}
function searchNotes(){const raw=$('notebook-search').value.trim(),parts=norm(raw).split(' ').filter(Boolean);const matches=parts.length?DB.index.filter(row=>{const t=norm(row.text),tc=compact(row.text);return parts.every(w=>t.includes(w)||tc.includes(compact(w)))}):[];const target=$('note-results');target.innerHTML='';$('note-results-count').textContent=raw?matches.length+' matching pages':'Search by a term or ES code';for(const row of matches.slice(0,90)){let b=document.createElement('button');b.className='hit';const s=norm(row.text);const i=s.indexOf(parts[0]);const excerpt=s.slice(Math.max(0,i-45),Math.max(0,i-45)+135);b.innerHTML='<strong>Page '+row.n+' · '+esc(row.section||titleNote(row.n))+'</strong><small>'+esc(excerpt)+'</small>';b.onclick=()=>setNotePage(row.n);target.appendChild(b)}if(matches.length>90)target.insertAdjacentHTML('beforeend','<p class="small muted">Showing the first 90 matches. Narrow the search to find more.</p>')}
function historical(){frame(`<main class="container"><div class="row"><div><span class="pill">Historical Distinction Unified Final</span><h2 style="margin-top:10px">Historical papers and model answers</h2><p class="muted">Original preserved HTML edition. Use the internal contents links to jump between topics.</p></div><a class="btn" href="#practice">Practise SBAs</a></div><div class="notice">These are independent historical reconstructions, not official released DSFE examination papers. The original text is preserved below.</div><iframe id="oldbookframe" title="Historical Distinction Unified Final"></iframe></main>`);
const iframe=$('oldbookframe');historyFrame=iframe;iframe.srcdoc=DB.historical;iframe.addEventListener('load',()=>{try{const d=iframe.contentDocument;const resize=()=>{iframe.style.height=Math.max(1100,d.documentElement.scrollHeight,d.body.scrollHeight)+30+'px'};resize();new ResizeObserver(resize).observe(d.body);d.addEventListener('click',e=>{const link=e.target.closest('a[href]');if(!link)return;const href=link.getAttribute('href');const m=href?.match(/(?:^|\/)\.?\/?(notes|practice|glossary|book-i|book-ii|book-iii|index|terminology)\.html(.*)$/i);if(m){e.preventDefault();navigate(({index:'home','book-i':'practice','book-ii':'practice','book-iii':'practice',terminology:'glossary'})[m[1]]||m[1]);}})}catch(e){console.warn('Embedded historical reader resize',e)}});
}
function glossary(){glossPage=0;frame(`<main class="container"><span class="pill">GPT-2023 · Tenth Edition</span><h2 style="margin-top:12px">Glossary of Prosthodontic Terms</h2><p class="muted">Search the ${DB.glossary.length.toLocaleString()} indexed entries from the uploaded Glossary of Prosthodontic Terms (2023). Source-page numbers refer to its 128-page PDF.</p><div class="panel"><div class="formrow"><label class="field" style="grid-column:span 2">Search expressions or definitions<input id="gloss-q" type="search" placeholder="e.g. centric relation, ferrule, implant support"></label><label class="field">Initial<select id="gloss-letter"><option value="">All initials</option>${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(c=>`<option value="${c.toLowerCase()}">${c}</option>`).join('')}</select></label></div><div class="controls" style="margin-top:12px"><label class="choose"><input type="radio" name="gloss-scope" value="both" checked> Terms and definitions</label><label class="choose"><input type="radio" name="gloss-scope" value="term"> Terms only</label><button class="btn" id="gloss-clear">Clear</button></div><p class="muted small" id="gloss-count"></p></div><div id="gloss-results"></div><div class="navbtns" id="gloss-pager"></div><div class="notice"><strong>Source:</strong> The Glossary of Prosthodontic Terms, 2023, Tenth Edition, <i>J Prosthet Dent</i> 130(4S1):e1–e126. <a target="_blank" rel="noopener" href="https://archive-ouverte.unige.ch/unige:181660">Open the published source record</a>. Extracted entries may contain PDF ligature or spacing artefacts.</div></main>`);
const q=$('gloss-q');q.value=qparam('q')||'';q.oninput=()=>{glossPage=0;searchGloss()};q.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();searchGloss()}};$('gloss-letter').onchange=()=>{glossPage=0;searchGloss()};document.querySelectorAll('input[name="gloss-scope"]').forEach(i=>i.onchange=()=>{glossPage=0;searchGloss()});$('gloss-clear').onclick=()=>{q.value='';$('gloss-letter').value='';glossPage=0;searchGloss();q.focus()};searchGloss();}
function searchGloss(){const q=norm($('gloss-q').value),initial=$('gloss-letter').value,scope=document.querySelector('input[name="gloss-scope"]:checked').value;const words=q.split(/\s+/).filter(Boolean);const results=[];if(!words.length&&!initial){$('gloss-count').textContent='Enter a term, definition keyword or choose an initial.';$('gloss-results').innerHTML='<div class="notice">Examples: <b>centric relation</b>, <b>ferrule</b>, <b>metamerism</b>, <b>pontic</b>.</div>';$('gloss-pager').innerHTML='';return;}
for(let i=0;i<DB.glossary.length;i++){const a=DB.glossary[i],term=norm(a[0]),def=norm(a[1]);if(initial&&!term.startsWith(initial))continue;let rank=1;if(words.length){if(term===q)rank=100;else if(term.startsWith(q))rank=80;else if(term.includes(q))rank=60;else if(words.every(w=>term.includes(w)))rank=40;else if(scope==='both'&&words.every(w=>def.includes(w)))rank=10;else continue;}results.push({i,rank});}
results.sort((a,b)=>b.rank-a.rank||String(DB.glossary[a.i][0]).localeCompare(DB.glossary[b.i][0]));glossHits=results;$('gloss-count').textContent=results.length.toLocaleString()+' matching records';const totalPages=Math.ceil(results.length/25);if(glossPage>=totalPages)glossPage=0;const target=$('gloss-results');target.innerHTML='';for(const {i}of results.slice(glossPage*25,glossPage*25+25)){const a=DB.glossary[i];const el=document.createElement('article');el.className='glossary-result';const term=document.createElement('h3');term.textContent=a[0];const pg=document.createElement('span');pg.className='gpage';pg.textContent='PDF page '+a[2];const d=document.createElement('div');d.className='definition';d.textContent=a[1];const det=document.createElement('details');const summary=document.createElement('summary');summary.textContent='Show full definition';det.append(summary,d);el.append(term,pg,det);target.appendChild(el)}
const pager=$('gloss-pager');pager.innerHTML='';if(totalPages>1){const prev=document.createElement('button');prev.className='btn';prev.textContent='← Previous';prev.disabled=glossPage===0;prev.onclick=()=>{glossPage--;searchGloss()};const next=document.createElement('button');next.className='btn';next.textContent='Next →';next.disabled=glossPage>=totalPages-1;next.onclick=()=>{glossPage++;searchGloss()};const meta=document.createElement('span');meta.className='muted small';meta.textContent='Page '+(glossPage+1)+' / '+totalPages;pager.append(prev,meta,next)}}
function pool(){const books=selected('p-book'),domains=selected('p-domain').map(Number),types=selected('p-type'),focus=$('p-focus').value;return DB.questions.filter(q=>books.includes(q.book)&&domains.includes(q.domain)&&types.some(t=>q.types.includes(t))&& (focus==='all'||(focus==='new'&&!(master.stats[q.id]?.tries>0))||(focus==='incorrect'&&master.stats[q.id]?.tries>0&&!master.stats[q.id].lastCorrect)||(focus==='flagged'&&master.stats[q.id]?.flagged)))}
function practice(){frame(`<main class="container"><div class="row"><div><span class="pill">Only Books I, II and III · 1,500 SBAs</span><h2 style="margin:11px 0 5px">Clinical SBA Practice</h2><p class="muted">Build a targeted revision set or simulate the 90-question/120-minute examination format.</p></div><a class="btn" href="#notes">Read source notebook</a></div><div id="setup-area" class="builder"><div><section class="panel"><h3>1. Select question books</h3><div class="choose">${['I','II','III'].map(b=>`<label><input type="checkbox" name="p-book" value="${b}" checked> Book ${b} · 500</label>`).join('')}</div></section><section class="panel"><div class="row"><h3>2. Select one or multiple domains</h3><div class="actions"><button class="btn" id="dom-all">All</button><button class="btn" id="dom-none">Clear</button></div></div><div class="checkgrid" id="domain-select">${Object.entries(DOMAINS).map(([n,t])=>`<label><input name="p-domain" type="checkbox" value="${n}" checked><span>${String(n).padStart(2,'0')} · ${t}</span></label>`).join('')}</div></section><section class="panel"><h3>3. Clinical question types</h3><div class="checkgrid">${TYPES.map(t=>`<label><input name="p-type" type="checkbox" value="${esc(t)}" checked>${esc(t)}</label>`).join('')}</div></section><section class="panel"><h3>4. Practice mode</h3><div class="checkgrid">${[['study','Study: immediate answer check'],['timed','Custom timed attempt'],['exam','90 SBAs · 120 min'],['full','Two papers · 90 SBAs each']].map(([v,t])=>`<label><input type="radio" name="p-mode" value="${v}" ${v==='study'?'checked':''}>${t}</label>`).join('')}</div><div class="formrow" style="margin-top:16px"><label class="field">Questions<input id="p-count" type="number" value="20" min="1" max="1500"></label><label class="field">Minutes<input id="p-min" type="number" value="30" min="1" max="480"></label><label class="field">Question history<select id="p-focus"><option value="all">All eligible</option><option value="new">Unattempted</option><option value="incorrect">Previously incorrect</option><option value="flagged">Flagged</option></select></label></div></section></div><aside><section class="panel sticky"><h3>Selected question pool</h3><div class="score" id="pool-size">1,500</div><p id="pool-info" class="small muted"></p><div id="pool-warning" class="notice warning hidden"></div><button class="btn primary" id="make-paper" style="width:100%">Start practice</button><button class="btn" id="resume-paper" style="width:100%;margin-top:9px">Resume saved attempt</button><hr><h3>Your study results</h3><p class="muted" id="practice-stats"></p><div class="controls"><button class="btn" id="export-results">Export</button><label class="btn">Import <input type="file" id="import-results" accept=".json,application/json" hidden></label></div></section></aside></div><div id="session-area" class="hidden"></div><div id="results-area" class="hidden"></div><div class="notice">Original educational answer keys and clinical explanations are preserved from Books I–III. No retained questions from the previous SBA bank are used. Review clinical guidance and proposed answers critically.</div></main>`);
for(const name of ['p-book','p-domain','p-type','p-mode'])document.querySelectorAll(`input[name="${name}"]`).forEach(x=>x.onchange=updatePool);$('p-focus').onchange=updatePool;
$('dom-all').onclick=()=>{document.querySelectorAll('input[name="p-domain"]').forEach(x=>x.checked=true);updatePool()};$('dom-none').onclick=()=>{document.querySelectorAll('input[name="p-domain"]').forEach(x=>x.checked=false);updatePool()};$('make-paper').onclick=startPaper;$('resume-paper').onclick=()=>{if(attempt&&!attempt.done)showSession();else alert('No unfinished practice paper saved on this browser.')};$('export-results').onclick=exportProgress;$('import-results').onchange=importProgress;
const bookParam=qparam('book');if(['I','II','III'].includes(bookParam))document.querySelectorAll('input[name="p-book"]').forEach(x=>x.checked=x.value===bookParam);if(qparam('mode')==='exam')document.querySelector('input[name="p-mode"][value="exam"]').checked=true;
updatePool();if(attempt&&!attempt.done)$('resume-paper').disabled=false;else $('resume-paper').disabled=true;}
function updatePool(){let p=pool(),m=document.querySelector('input[name="p-mode"]:checked')?.value||'study',need=m==='full'?180:m==='exam'?90:1;if(m==='exam'||m==='full'){$('p-count').value=need;$('p-count').disabled=true;$('p-min').value=120;$('p-min').disabled=true}else{$('p-count').disabled=false;$('p-min').disabled=m==='study'}$('pool-size').textContent=p.length.toLocaleString();$('pool-info').textContent=p.length?Object.entries(p.reduce((a,q)=>(a[q.book]=(a[q.book]||0)+1,a),{})).map(([b,c])=>`Book ${b}: ${c}`).join(' · '):'Change the filters to include questions';const warn=$('pool-warning');warn.classList.toggle('hidden',p.length>=need);warn.textContent=p.length<need?`Need at least ${need} eligible questions for this mode.`:'';$('make-paper').disabled=p.length<need;$('practice-stats').textContent=`${progressCount().toLocaleString()} / 1,500 questions attempted · ${(master.history||[]).length} completed attempts`}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startPaper(){const mode=document.querySelector('input[name="p-mode"]:checked').value,p=pool(),n=mode==='full'?180:mode==='exam'?90:Math.min(Math.max(1,Number($('p-count').value)||20),p.length),minutes=mode==='study'?0:mode==='exam'||mode==='full'?120:Math.max(1,Number($('p-min').value)||30);if(p.length<n){alert('Not enough questions match these filters.');return}if(attempt&&!attempt.done&&!confirm('An unfinished attempt exists. Replace it with a new attempt?'))return;
const ids=shuffle(p).slice(0,n).map(q=>q.id);attempt={ids,answers:{},flags:{},revealed:{},positions:[0,0],mode,minutes,phase:0,submitted:[],done:false,review:false,created:Date.now(),deadlines:[minutes?Date.now()+minutes*60000:null]};persistAttempt();showSession()}
function inPhase(){if(!attempt)return[];return attempt.mode==='full'?(attempt.phase===0?attempt.ids.slice(0,90):attempt.ids.slice(90,180)):attempt.ids}
function currentQuestion(){return BY_ID.get(inPhase()[attempt.positions[attempt.phase]||0])}
function scorePaper(ids){return ids.reduce((c,id)=>c+(attempt.answers[id]===BY_ID.get(id)?.correct?1:0),0)}
function showSession(){if(!attempt)return;const sess=$('session-area');$('setup-area').classList.add('hidden');$('results-area').classList.add('hidden');sess.classList.remove('hidden');
sess.innerHTML=`<div class="builder"><div><div class="panel"><div class="row"><div><span class="pill" id="session-tag"></span><h2 id="session-title" style="margin:12px 0 4px">Question</h2><div class="source" id="question-source"></div></div><span class="clock" id="timer">Untimed</span></div><div class="progressbar"><i id="paper-progress" style="width:0"></i></div><div id="q-content"></div><div class="navbtns"><button class="btn" id="p-prev">← Previous</button><button class="btn" id="p-next">Next →</button><button class="btn" id="p-flag">☆ Flag</button><button class="btn primary" id="p-check">Check answer</button><button class="btn" id="p-submit">Submit paper</button></div></div></div><aside class="panel sticky"><h3>Question navigator</h3><div class="palette" id="question-palette"></div><p id="ans-count" class="small muted"></p><div class="controls"><button class="btn" id="p-new">New attempt</button><button class="btn" id="p-export">Export scores</button><button class="btn hidden" id="p-back-results">Back to results</button></div></aside></div>`;
$('p-prev').onclick=()=>gotoQ((attempt.positions[attempt.phase]||0)-1);$('p-next').onclick=()=>gotoQ((attempt.positions[attempt.phase]||0)+1);$('p-flag').onclick=()=>{const id=currentQuestion()?.id;if(!id)return;attempt.flags[id]=!attempt.flags[id];persistAttempt();renderQ()};$('p-check').onclick=()=>{const q=currentQuestion();if(!q||!attempt.answers[q.id])return;attempt.revealed[q.id]=true;persistAttempt();renderQ()};$('p-submit').onclick=submitPaper;$('p-new').onclick=()=>{if(confirm('Start a different attempt? Unsaved paper answers will be replaced.')){attempt=null;persistAttempt();practice()}};$('p-export').onclick=exportProgress;$('p-back-results').classList.toggle('hidden',!attempt.review);$('p-back-results').onclick=showResults;renderQ();startTick()}
function gotoQ(i){const ids=inPhase();if(i<0||i>=ids.length)return;attempt.positions[attempt.phase]=i;persistAttempt();renderQ()}
function renderQ(){const q=currentQuestion();if(!q)return;const ids=inPhase(),pos=attempt.positions[attempt.phase]||0,review=attempt.review===true;const exam=attempt.mode!=='study';$('session-tag').textContent=attempt.mode==='full'?`Paper ${attempt.phase+1} of 2`:(attempt.mode==='exam'?'Exam practice':attempt.mode==='timed'?'Timed revision':'Study mode');$('session-title').textContent=`Question ${pos+1} of ${ids.length}`;$('question-source').textContent=`Book ${q.book} · ${String(q.domain).padStart(2,'0')} ${DOMAINS[q.domain]} · ES ${q.es} · ${q.id}`;
const selectedLetter=attempt.answers[q.id],showReason=review||attempt.revealed[q.id]&&attempt.mode==='study';$('q-content').innerHTML=`<div class="stem">${esc(q.stem)}</div><p class="lead">${esc(q.lead||'Select the single best answer.')}</p><div class="options">${Object.entries(q.options).map(([letter,answer])=>`<button class="opt ${selectedLetter===letter?'chosen':''} ${showReason?(letter===q.correct?'good':selectedLetter===letter?'bad':''):''}" data-choice="${letter}" ${review?'disabled':''}><b>${letter}.</b><span>${esc(answer)}</span></button>`).join('')}</div>${showReason?`<div class="review"><b>Proposed answer: ${esc(q.correct)}</b> · ${selectedLetter===q.correct?'Correct':'Review the justification'}\n\n${esc(q.solution)}</div>`:''}`;
for(const b of document.querySelectorAll('.opt'))b.onclick=()=>{if(review)return;attempt.answers[q.id]=b.dataset.choice;persistAttempt();renderQ()};$('p-check').classList.toggle('hidden',attempt.mode!=='study'||review);$('p-submit').classList.toggle('hidden',review);$('p-flag').classList.toggle('hidden',review);$('p-flag').textContent=attempt.flags[q.id]?'★ Flagged':'☆ Flag';$('p-prev').disabled=pos===0;$('p-next').disabled=pos===ids.length-1;$('paper-progress').style.width=(100*(pos+1)/ids.length)+'%';$('ans-count').textContent=ids.filter(id=>attempt.answers[id]).length+' of '+ids.length+' answered';$('question-palette').innerHTML=ids.map((id,i)=>`<button title="Question ${i+1}" data-idx="${i}" class="${attempt.answers[id]?'answered':''} ${attempt.flags[id]?'flagged':''} ${i===pos?'current':''}">${i+1}</button>`).join('');document.querySelectorAll('#question-palette button').forEach(b=>b.onclick=()=>gotoQ(+b.dataset.idx))}
function startTick(){if(tick)clearInterval(tick);if(attempt.review||attempt.done){const t=$('timer');if(t)t.textContent='Review mode';return;}const timer=$('timer');const update=()=>{if(!attempt||attempt.done||route!=='practice'||!timer)return;const deadline=attempt.deadlines?.[attempt.phase];if(!deadline){timer.textContent='Untimed';return}const s=Math.max(0,Math.ceil((deadline-Date.now())/1000));timer.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s===0){clearInterval(tick);submitPaper(true)}};update();tick=setInterval(update,1000)}
function submitPaper(auto=false){if(!attempt||attempt.done)return;const ids=inPhase(),n=ids.filter(id=>attempt.answers[id]).length;if(!auto&&n<ids.length&&!confirm(`${ids.length-n} questions are unanswered. Submit the paper?`))return;if(tick)clearInterval(tick);attempt.submitted[attempt.phase]=true;persistAttempt();if(attempt.mode==='full'&&attempt.phase===0){$('session-area').innerHTML=`<div class="panel"><span class="pill">Paper 1 submitted</span><h2 style="margin-top:13px">Paper 1 saved</h2><p>Paper 1 answers and scores remain hidden until the second paper is finished, as in the exam preparation format.</p><button class="btn primary" id="begin-two">Begin Paper 2 · 90 SBAs / 120 min</button></div>`;$('begin-two').onclick=()=>{attempt.phase=1;attempt.deadlines[1]=Date.now()+120*60000;persistAttempt();showSession()};return}finishAttempt()}
function finishAttempt(){attempt.done=true;attempt.review=false;let correct=0;for(const id of attempt.ids){const q=BY_ID.get(id),ans=attempt.answers[id],win=!!ans&&ans===q.correct;correct+=win?1:0;const st=master.stats[id]||{tries:0,correct:0};st.tries=(st.tries||0)+1;st.correct=(st.correct||0)+(win?1:0);st.lastCorrect=win;st.lastAnswer=ans||'';st.flagged=!!attempt.flags[id];master.stats[id]=st}master.history.push({date:new Date().toISOString(),mode:attempt.mode,n:attempt.ids.length,correct});persist();persistAttempt();showResults()}
function showResults(){if(tick)clearInterval(tick);$('setup-area').classList.add('hidden');$('session-area').classList.add('hidden');$('results-area').classList.remove('hidden');const n=attempt.ids.length,score=scorePaper(attempt.ids);const groups={};for(const id of attempt.ids){const q=BY_ID.get(id),k=q.domain;if(!groups[k])groups[k]=[0,0];groups[k][1]++;if(attempt.answers[id]===q.correct)groups[k][0]++}
$('results-area').innerHTML=`<div class="panel"><span class="pill">Attempt completed</span><h2 style="margin-top:13px">Your result</h2><div class="score">${score} / ${n} · ${Math.round(100*score/n)}%</div><p class="muted">Unanswered: ${attempt.ids.filter(id=>!attempt.answers[id]).length} · Flagged: ${Object.values(attempt.flags).filter(Boolean).length}</p><h3>Performance by domain</h3><div>${Object.entries(groups).sort((a,b)=>+a[0]-+b[0]).map(([dom,[c,total]])=>`<p><strong>${esc(DOMAINS[dom])}</strong>: ${c} / ${total} · ${Math.round(100*c/total)}%</p>`).join('')}</div><div class="actions"><button class="btn primary" id="result-review">Review ${attempt.mode==='full'?'Paper 1':'all answers'}</button>${attempt.mode==='full'?'<button class="btn" id="result-review-two">Review Paper 2</button>':''}<button class="btn" id="result-new">New practice</button><button class="btn" id="result-export">Export results</button></div></div>`;$('result-review').onclick=()=>{attempt.phase=0;attempt.positions=[0,0];attempt.review=true;persistAttempt();showSession()};if($('result-review-two'))$('result-review-two').onclick=()=>{attempt.phase=1;attempt.positions=[0,0];attempt.review=true;persistAttempt();showSession()};$('result-new').onclick=()=>{attempt=null;persistAttempt();practice()};$('result-export').onclick=exportProgress}
function exportProgress(){const data={version:'FPros standalone v1',date:new Date().toISOString(),master,session:attempt};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='FPros_SBA_Progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}
async function importProgress(e){const file=e.target.files?.[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!data?.master?.stats)throw new Error('Not a compatible progress file.');if(!confirm('Import saved scores from the selected file into this browser?'))return;Object.assign(master.stats,data.master.stats);master.history=(data.master.history||[]).slice(-1000);persist();alert('Progress imported.');practice()}catch(e){alert(e.message)}}
function renderRoute(){route=getRoute();if(tick){clearInterval(tick);tick=null}if(route==='notes')notebook();else if(route==='practice'){practice();if(attempt&&!attempt.done){/* allow resume on the configuration screen */}}else if(route==='historical')historical();else if(route==='glossary')glossary();else homepage()}
if('serviceWorker' in navigator && location.protocol==='https:'){navigator.serviceWorker.getRegistration('./').then(r=>{if(r&&r.scope.includes('/DSFE-Fpros/'))r.unregister();}).catch(()=>{})}
window.addEventListener('hashchange',renderRoute);window.addEventListener('keydown',e=>{if(route!=='notes'||/INPUT|TEXTAREA|SELECT/.test(e.target?.tagName||''))return;if(e.key==='ArrowLeft')setNotePage(notePage-1);if(e.key==='ArrowRight')setNotePage(notePage+1)});
renderRoute();
})();
